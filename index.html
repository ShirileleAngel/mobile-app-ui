<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPulse | Mobile App UI Demo</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }

        /* Phone Frame Mockup */
        .phone-frame {
            width: 100%;
            max-width: 380px;
            height: 750px;
            background: #090d16;
            border: 12px solid #334155;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* App Header */
        .app-header {
            padding: 1.5rem 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header h2 { font-size: 1.2rem; font-weight: 700; }
        .avatar { width: 38px; height: 38px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Scrollable App Content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.5rem 1.5rem;
        }

        /* Banner Card */
        .hero-card {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }
        .hero-card h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .hero-card p { font-size: 0.85rem; opacity: 0.9; margin-bottom: 1rem; }
        .action-pill { background: white; color: var(--bg); border: none; padding: 0.4rem 1rem; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

        /* Stats Grid */
        .section-title { font-size: 0.95rem; color: var(--muted); margin-bottom: 0.8rem; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card-bg); padding: 1rem; border-radius: 12px; border: 1px solid #334155; }
        .stat-card span { font-size: 0.75rem; color: var(--muted); }
        .stat-card h4 { font-size: 1.2rem; margin-top: 0.2rem; color: var(--primary); }

        /* Activity List */
        .activity-item { background: var(--card-bg); padding: 0.8rem 1rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; border: 1px solid #334155; font-size: 0.85rem; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            height: 65px;
            background: #111827;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item { color: var(--muted); font-size: 0.75rem; text-align: center; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Header -->
        <div class="app-header">
            <div>
                <span style="font-size: 0.75rem; color: var(--muted);">Welcome back</span>
                <h2>FitPulse Dashboard</h2>
            </div>
            <div class="avatar">SA</div>
        </div>

        <!-- Scrollable Body -->
        <div class="app-content">
            <!-- Hero Card -->
            <div class="hero-card">
                <h3>Daily Goal Almost Met! 🔥</h3>
                <p>You've completed 4 out of 5 daily mobile routines.</p>
                <button class="action-pill" onclick="alert('Session resumed!')">Resume Workout</button>
            </div>

            <!-- Stats -->
            <div class="section-title">Today's Metrics</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span>Steps</span>
                    <h4>8,432</h4>
                </div>
                <div class="stat-card">
                    <span>Active Time</span>
                    <h4>45 mins</h4>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="section-title">Recent Workouts</div>
            <div class="activity-item">
                <span>Morning Stretch & Core</span>
                <span style="color: #10b981;">Completed</span>
            </div>
            <div class="activity-item">
                <span>HIIT Cardio Blast</span>
                <span style="color: #10b981;">Completed</span>
            </div>
            <div class="activity-item">
                <span>Evening Walk</span>
                <span style="color: var(--muted);">Pending</span>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item active">🏠<br>Home</button>
            <button class="nav-item">📊<br>Stats</button>
            <button class="nav-item">⚙️<br>Settings</button>
        </div>
    </div>

</body>
</html>
